<script type="module">
import * as THREE from 'three';
import {configure} from '../engine/config.js';
import {FirstDawn} from '../works/terra_incognita/first-dawn.js';
import {heightCPU,setWorldMode,shadeSky,uFirstDawn} from '../works/terra_incognita/surface.js';
import {buildSky} from '../engine/world/sky.js';
import {Ambient} from '../engine/core/ambient.js';
const tier=new URLSearchParams(location.search).get('quality')||'high';
configure({tier,metric:{rs:0},atmosphere:{fogDensity:0}});setWorldMode('granite');
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,40000);
const renderer=new THREE.WebGPURenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.append(renderer.domElement);await renderer.init();
const sky=buildSky(shadeSky);scene.add(sky);
const geometry=new THREE.PlaneGeometry(1800,1800,180,180);geometry.rotateX(-Math.PI/2);
const p=geometry.attributes.position;
for(let i=0;i<p.count;i++){const x=p.getX(i)+120,z=p.getZ(i)+460;p.setXYZ(i,x,heightCPU(x,z),z);}
geometry.computeVertexNormals();
const ground=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({color:0x242a2d}));scene.add(ground);
camera.position.set(120,heightCPU(120,460)+2,468);camera.lookAt(120,heightCPU(120,460)+1,410);
const dawn=new FirstDawn({scene,camera,heightAt:heightCPU,tier});
const ambient=new Ambient();document.addEventListener('pointerup',()=>ambient.start(),{once:true});
const sites=[{x:90,z:410,coherence:.9},{x:150,z:385,coherence:.7},{x:115,z:350,coherence:.8}];
dawn.start({rover:{pos:{x:120,z:460}},sites,now:0});
window.preview={dawn,camera,renderer,scene,ambient,render:async(seconds)=>{dawn.update(seconds*1000);uFirstDawn.value=Math.max(0,Math.min(1,(seconds-17)/18));sky.position.copy(camera.position);await renderer.renderAsync(scene,camera);return dawn.snapshot();}};
await preview.render(0);window.ready=true;
</script>
