    <style>
      :root {
        color-scheme: light;
        --paper: #fbfbfa;
        --ink: #10100f;
        --dim: #70706a;
        --signal: #c65d22;
        --green: #536e5b;
        --pad: max(16px, 1.875vw, env(safe-area-inset-left), env(safe-area-inset-right));
        --columns: 4.06vw 16.4vw 16.4vw minmax(84px, 1fr);
        --row: 28px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: var(--paper);
      }
      body {
        overflow-x: hidden;
        color: var(--ink);
        font-family: Arial, Helvetica, "Noto Sans KR", sans-serif;
        font-size: clamp(14px, 1.1vw, 17px);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      button,
      a {
        color: inherit;
        font: inherit;
      }
      button {
        border: 0;
      }
      a {
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      a:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: none;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      .site-header {
        position: fixed;
        z-index: 20;
        inset: 0 0 auto;
        height: calc(56px + env(safe-area-inset-top));
        display: grid;
        grid-template-columns: var(--columns);
        align-items: start;
        padding: calc(16px + env(safe-area-inset-top)) var(--pad) 0;
        background: rgba(251, 251, 250, 0.96);
      }
      .monogram {
        grid-column: 1 / 3;
        display: grid;
        grid-template-columns: 4.06vw 1fr;
        margin: 0;
        font-size: inherit;
        font-weight: 400;
        line-height: 20px;
      }
      .filters {
        grid-column: 3 / 5;
        justify-self: start;
        display: flex;
        gap: 0;
        min-width: 0;
        white-space: nowrap;
      }
      .filter {
        position: relative;
        min-height: 28px;
        padding: 0 12px 4px 0;
        background: transparent;
        color: var(--dim);
        line-height: 20px;
        cursor: pointer;
      }
      .filter:hover,
      .filter:focus-visible,
      .filter[aria-pressed="true"] {
        color: var(--ink);
        outline: none;
      }
      .filter[aria-pressed="true"]::after {
        content: "";
        position: absolute;
        right: 12px;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--signal);
      }
      .back {
        position: absolute;
        top: calc(16px + env(safe-area-inset-top));
        right: var(--pad);
        color: var(--dim);
        line-height: 20px;
        text-decoration: none;
      }
      .back:hover,
      .back:focus-visible {
        color: var(--ink);
        outline: none;
      }
      .back:hover {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .archive {
        min-height: 100dvh;
        padding-top: calc(64px + env(safe-area-inset-top));
      }
      .ledger-head,
      .record {
        display: grid;
        grid-template-columns: var(--columns);
        align-items: center;
        padding-inline: var(--pad);
      }
      .ledger-head {
        height: 40px;
        align-items: start;
        color: var(--ink);

            frameSurface.classList.add("empty");
          });
          const returnLink = document.querySelector("[data-return]");
          let returnPage = "planet-01.html";
          try {
            const saved = sessionStorage.getItem("terra-incognita:last-planet");
            if (/^planet-0[1234]\.html$/.test(saved)) returnPage = saved;
          } catch {}
          if (returnLink) returnLink.href = returnPage;
          const post = readPostMission();
          if (post && returnLink) returnLink.href = POST_PHASES[post.phase].file;
          returnLink?.addEventListener("click", (event) => {
            if (
              event.button !== 0 ||
              event.metaKey ||
              event.ctrlKey ||
              event.shiftKey ||
              event.altKey ||
              history.length <= 1
            )
              return;
            event.preventDefault();
            history.back();
          });
          render();
          void mountPlaceArchive(document.querySelector(".archive"));
        })();
      })();
    </script>
  </body>
</html>
