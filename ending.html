<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#030507" />
    <title>BEYOND THE KNOWN - A Terraforming Project · BEYOND THE KNOWN</title>
    <link rel="icon" href="data:," />
    <style>
      [hidden] {
        display: none !important;
      }
      #cut {
        position: fixed;
        inset: 0;
        background: #030507;
        z-index: 1;
        pointer-events: none;
        opacity: 0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #030507;
        color: #c9cbc7;
        font-family: Arial, "Apple SD Gothic Neo", sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .frame {
        position: fixed;
        left: 0;
        right: 0;
        height: 7vh;
        background: #020304;
        z-index: 2;
        pointer-events: none;
      }
      .top {
        top: 0;
      }
      .bottom {
        bottom: 0;
      }
      header {
        position: fixed;
        top: calc(3vh + env(safe-area-inset-top));
        left: 4vw;
        z-index: 3;
        font-size: 10px;
        letter-spacing: 0.3em;
        color: #697278;
      }
      header span {
        margin-left: 24px;
        color: #49535a;
      }
      #line {
        position: fixed;
        bottom: 16vh;
        left: 7vw;
        right: 7vw;
        text-align: center;
        font-size: clamp(14px, 1.25vw, 21px);
        font-weight: 300;
        letter-spacing: 0.24em;
        opacity: 0;
        pointer-events: none;
        text-shadow: 0 2px 10px #000;
      }
      footer {
        position: fixed;
        bottom: calc(2.6vh + env(safe-area-inset-bottom));
        left: 4vw;
        right: 4vw;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 3;
        font-size: 11px;
        letter-spacing: 0.19em;
        color: #596267;
      }
      nav {
        display: flex;
        gap: 24px;
        align-items: center;
      }
      button,
      a {
        background: none;
        border: 0;
        padding: 8px 0;
        font: inherit;
        letter-spacing: inherit;
        color: #9ba5a8;
        text-decoration: none;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 1px solid #bac4c4;
        outline-offset: 5px;
      }
      button:hover,
      a:hover {
        color: #fff;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        background: #030507;
        z-index: 5;
        transition: opacity 1.2s;
        font-size: 12px;
        letter-spacing: 0.16em;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #error {
        position: fixed;
        inset: 25%;
        z-index: 6;
        line-height: 1.8;
        text-align: center;
      }
      #error[hidden] {
        display: none;
      }
      @media (max-width: 600px) {
        header span {
          display: none;
        }
        footer {
          font-size: 11px;
        }
        nav {
          gap: 14px;
        }
        #credit {
          max-width: 95px;
          line-height: 1.8;
        }
        .frame {
          height: 6vh;
        }
        #line {
          font-size: 14px;
          line-height: 2;
          letter-spacing: 0.15em;
          bottom: 19vh;
        }
      }
      #arrival-intro {
        position: fixed;
        left: 7vw;
        right: 7vw;
        top: 39%;
        z-index: 3;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        text-shadow: 0 2px 16px #000;
      }
      #arrival-intro span,
      #line span {
        display: block;
      }
      #arrival-intro [lang="en"],
      #line [lang="en"] {
        font-size: clamp(18px, 2.1vw, 30px);
        font-weight: 300;
        letter-spacing: 0.15em;
        color: #e0e0dc;
      }
      #arrival-intro [lang="ko"],
      #line [lang="ko"] {
        margin-top: 14px;
        font-size: clamp(12px, 1vw, 16px);
        font-weight: 300;
        letter-spacing: 0.2em;
        color: #c5c5c1;
      }
      @media (max-width: 600px) {
        #arrival-intro {
          top: 39%;
        }
        #arrival-intro [lang="en"],
        #line [lang="en"] {
          font-size: 18px;
          letter-spacing: 0.07em;
        }
        #arrival-intro [lang="ko"],
        #line [lang="ko"] {
          margin-top: 10px;
          font-size: 13px;
          letter-spacing: 0.12em;
        }
      }
      #line > a {
        min-height: 44px;
        padding: 10px 0;
        line-height: 1.6;
      }
      #line > a:focus-visible {
        outline: none;
        text-decoration: underline;
        text-underline-offset: 5px;
      }
      @media (max-height: 420px) and (orientation: landscape) {
        body[data-phase="ending"] #line {
          top: calc(var(--cinema-top, 0px) + 22svh) !important;
        }
      }
      #sound {
        width: 44px;
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      #sound svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #sound .sound-waves {
        display: none;
      }
      #sound[aria-pressed="true"] .sound-waves {
        display: initial;
      }
      #sound[aria-pressed="true"] .sound-muted {
        display: none;
      }
    </style>
    <style>
      #vehicle-preview-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 8px 12px;
        color: #b8c3cb;
        font:
          12px/1.4 Arial,
          sans-serif;
        letter-spacing: 0.12em;
        text-decoration: none;
        touch-action: manipulation;
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
      }
      #vehicle-preview-link:hover {
        color: #fff;
        text-decoration: underline;
      }
      #vehicle-preview-link:focus-visible {
        outline: none;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
    <style id="site-typography">
      html:root { --site-type-min: 9px; --site-nav-size: 10px; }
      body #vehicle-preview-link,
      body .preview-actions #vehicle-preview-link,
      body #journey-links #vehicle-preview-link,
      body footer nav a,
      body footer nav.series-nav a,
      body .preview-actions .back,
      body .topbar a,
      body #ti-ending-archive { font-size: var(--site-nav-size); }
      body #ti-copyright,
      body footer #credit,
      body .footer > span { font-size: 9px; }
      @media (max-width: 760px), (pointer: coarse) and (max-width: 1024px) {
        html:root { --site-type-min: 6px; --site-nav-size: 9px; }
        body #ti-copyright,
        body footer #credit,
        body .footer > span { font-size: 8px; }
      }

      body { font-size: 11.5px; }
      body header { font-size: 9px; }
      body footer { font-size: 10px; }
      body #loading { font-size: 10.5px; }
      body #line { font-size: clamp(12.5px, 1.1vw, 18px); }
      body #arrival-intro [lang="en"],
      body #line [lang="en"] { font-size: clamp(16px, 1.85vw, 26px); }
      body #arrival-intro [lang="ko"],
      body #line [lang="ko"] { font-size: clamp(10.5px, .875vw, 14px); }
      @media (max-width: 760px), (pointer: coarse) and (max-width: 1024px) {
        body #line { font-size: 12.5px; }
        body #arrival-intro [lang="en"],
        body #line [lang="en"] { font-size: 16px; }
        body #arrival-intro [lang="ko"],
        body #line [lang="ko"] { font-size: 11.5px; }
      }
    </style>
</head

  <body data-phase="ending">
    <div id="cut" aria-hidden="true"></div>
    <div class="frame top"></div>
    <div class="frame bottom"></div>
    <header>
      FIRST DAWN
      <span>BEYOND THE KNOWN - A Terraforming Project / EPILOGUE</span>
    </header>
    <div id="loading">불러오는 중</div>
    <div id="error" hidden></div>
    <div id="arrival-intro" aria-label="A Terraforming Project, 테라포밍 프로젝트">
      <span lang="en">A Terraforming Project</span><span lang="ko">테라포밍 프로젝트</span>
    </div>
    <div id="line">
      <span lang="en">We begin here now</span><span lang="ko">우리는 이제 여기서 시작한다</span>
    </div>
    <footer>
      <span id="credit">© 2026 KIM GUNWOO</span>
      <nav>
        <button id="sound" aria-label="소리 켜기" title="소리 켜기" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4Z" />
            <g class="sound-waves">
              <path d="M15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14" />
            </g>
            <path class="sound-muted" d="m16 9 6 6m0-6-6 6" /></svg></button
        ><a
          id="vehicle-preview-link"
          href="preview.html?from=ending.html"
          aria-label="로버 · 탐사선 · 이주선 외장 보기"
          >PREVIEW</a
        ><button id="replay" hidden>REPLAY</button
        ><a id="archive" href="field-archive.html" hidden>FIELD ARCHIVE</a
        ><a id="return" href="index.html">RETURN</a>
      </nav>
    </footer>
